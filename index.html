<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krzysztof Hanas | Cybersecurity</title>
    <style>
        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: "Courier New", monospace;
        }

        .page {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
            padding: 32px 20px;
            isolation: isolate;
        }

        .page::before {
            content: "";
            position: absolute;
            z-index: -2;
            width: min(78vw, 780px);
            aspect-ratio: 1;
            background: url("assets/shield-background.svg") center / contain no-repeat;
            opacity: .72;
            filter: drop-shadow(0 0 16px rgba(0, 255, 102, .18));
        }

        .page::after {
            content: "";
            position: absolute;
            z-index: -1;
            width: min(68vw, 680px);
            height: min(58vw, 580px);
            background: radial-gradient(ellipse, rgba(0,0,0,.82) 0%, rgba(0,0,0,.65) 45%, rgba(0,0,0,0) 76%);
            pointer-events: none;
        }

        main {
            width: min(92vw, 900px);
            text-align: center;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(2.35rem, 6vw, 5rem);
            line-height: 1.05;
            letter-spacing: .01em;
        }

        h2 {
            margin: 0 0 22px;
            color: #d6d6d6;
            font-size: clamp(1rem, 2.1vw, 1.5rem);
            font-weight: 400;
        }

        p {
            margin: 0 0 30px;
            color: #bdbdbd;
            font-size: clamp(.9rem, 1.4vw, 1.05rem);
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            border: 2px solid #00e85c;
            border-radius: 8px;
            color: #00f06a;
            background: rgba(0,0,0,.72);
            box-shadow: 0 0 12px rgba(0,232,92,.28);
            text-decoration: none;
            transition: .18s ease;
        }

        a:hover, a:focus-visible {
            color: #000;
            background: #00e85c;
            box-shadow: 0 0 22px rgba(0,232,92,.65);
            outline: none;
        }

        @media (max-width: 600px) {
            .page::before {
                width: min(125vw, 650px);
                opacity: .58;
            }
            .page::after {
                width: 110vw;
                height: 75vh;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <main>
            <h1>Krzysztof Hanas</h1>
            <h2>Cybersecurity | SOC Analyst</h2>
            <p>Personal cybersecurity SOC lab.</p>
            <a href="https://github.com/Krisqzpl/krzysztofhanas.com" target="_blank" rel="noopener noreferrer">SOC Lab on GitHub</a>
        </main>
    </div>
</body>
</html>
