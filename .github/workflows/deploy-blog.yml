name: Deploy Blog

on:
  push:
    branches:
      - main
    paths:
      - "blog/**"

jobs:
  deploy:
    runs-on: [self-hosted, blog]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy blog to nginx
        run: |
          rsync -av --delete ./blog/ /var/www/blog/
